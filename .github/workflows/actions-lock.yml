name: Actions lock

on:
  pull_request:
    paths:
      - ".github/**"

permissions:
  contents: read

jobs:
  verify:
    name: Verify actions lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify actions lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.2.0
          gh actions-lock --verify
